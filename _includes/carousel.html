<div id="homeCarousel" class="carousel slide" data-ride="carousel" data-interval="5000">
    <ol class="carousel-indicators">
        <li data-target="#homeCarousel" data-slide-to="0" class="active"></li>
        <li data-target="#homeCarousel" data-slide-to="1"></li>
        <li data-target="#homeCarousel" data-slide-to="2"></li>
        <li data-target="#homeCarousel" data-slide-to="3"></li>
        <li data-target="#homeCarousel" data-slide-to="4"></li>
    </ol>
    <div class="carousel-inner">
        {% assign first_slide = true %}
        {% for image in site.data.carousel %}
            {% if first_slide %}
                <div class="carousel-item active">
                    <img class="d-block w-100" src="{{ image.file }}" alt="{% increment my_counter %}">
                    <div class="carousel-caption d-none d-md-block bg-dark mb-4">
                        <p>{{ image.caption }}</p>
                    </div>
                </div>
                {% assign first_slide = false %}
            {% else %}
                <div class="carousel-item">
                    <img class="d-block w-100" src="{{ image.file }}" alt="{% increment my_counter %}">
                    <div class="carousel-caption d-none d-md-block bg-dark mb-4">
                        <p>{{ image.caption }}</p>
                    </div>
                </div>
            {% endif %}
        {% endfor %}
    </div>
    <a class="carousel-control-prev" href="#homeCarousel" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
    </a>
    <a class="carousel-control-next" href="#homeCarousel" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
    </a>
</div>
